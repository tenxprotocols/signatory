name: Tenx Build & Release

# Triggers:
#   - Tag push matching `v*` (covers both upstream-style `vX.Y.Z` and
#     fork `vX.Y.Z-tenx.N` tags).
#   - Manual workflow_dispatch with a ref input -- used to publish
#     upstream tags into our registry without committing them locally.
#
# All untrusted input (inputs.ref, github.ref) is passed into shell
# steps via `env:` and dereferenced as $VAR, never interpolated
# directly into a run script. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or sha). The image tag will be the sanitized ref.'
        required: true
      source_repo:
        description: 'Source repository (owner/name). Leave empty to use this repo. Set to ecadlabs/signatory to republish a vanilla upstream tag without first pushing it to our fork.'
        required: false
        default: ''

env:
  GO_VERSION: '1.26.2'
  GHCR_IMAGE: ghcr.io/tenxprotocols/signatory

permissions:
  contents: read
  packages: write
  id-token: write  # for OIDC -> GCP Workload Identity Federation

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.compute.outputs.ref }}
      image_tag: ${{ steps.compute.outputs.image_tag }}
    steps:
      - id: compute
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_REF: ${{ github.ref }}
        run: |
          REF="${INPUT_REF:-$GH_REF}"
          REF="${REF#refs/tags/}"
          REF="${REF#refs/heads/}"
          TAG="${REF//\//-}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Full suite without -race matches upstream's own CI behavior;
      # they have pre-existing races (e.g. pkg/middlewares JWT tests)
      # that we should not block our release on.
      - name: Unit tests (full suite)
        run: go test -count=1 $(go list ./... | grep -v integration_test)
      # Race detector on packages Tenx actually patches, to catch
      # concurrency issues in our own code.
      - name: Unit tests with race detector (Tenx-patched packages)
        run: go test -count=1 -race ./pkg/vault/confidentialspace/rpc/... ./pkg/vault/nitro/rpc/...

  publish:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.DOCKER_RELEASE_USER }}
          password: ${{ secrets.DOCKER_RELEASE_TOKEN }}

      # GAR push is gated on TENX_GAR_PROJECT being set as a repo
      # variable. Until you wire up Workload Identity Federation, the
      # GAR steps are skipped and we publish to GHCR only.
      - name: Authenticate to GCP
        if: vars.TENX_GAR_PROJECT != ''
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TENX_GAR_WIF_PROVIDER }}
          service_account: ${{ secrets.TENX_GAR_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: vars.TENX_GAR_PROJECT != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TENX_GAR_LOCATION }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Compute image refs
        id: tags
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          GAR_LOCATION: ${{ vars.TENX_GAR_LOCATION }}
          GAR_PROJECT: ${{ vars.TENX_GAR_PROJECT }}
          GAR_REPOSITORY: ${{ vars.TENX_GAR_REPOSITORY }}
        run: |
          TAGS="${GHCR_IMAGE}:${IMAGE_TAG}"
          if [ -n "$GAR_PROJECT" ]; then
            GAR_IMAGE="${GAR_LOCATION}/${GAR_PROJECT}/${GAR_REPOSITORY}/signatory"
            TAGS="${TAGS},${GAR_IMAGE}:${IMAGE_TAG}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
